name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag or version name, for example v00.01.00 or v00.01.00-rc1"
        required: true
        type: string

# ── Environment ─────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Version extraction ────────────────────────────────────────────────────
  get-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.set-version.outputs.VERSION }}
      VERSION_NAME: ${{ steps.set-version.outputs.VERSION_NAME }}
      IS_PRERELEASE: ${{ steps.set-version.outputs.IS_PRERELEASE }}
    steps:
      - name: Set version
        id: set-version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          # Strip leading "v"
          TAG_NAME="${TAG_NAME#v}"

          echo "VERSION=$(echo "$TAG_NAME" | sed 's/-rc.*//')" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          if echo "$TAG_NAME" | grep -q -- '-rc'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

  # ── Windows build (x86_64) ────────────────────────────────────────────────
  windows-build:
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      IS_PRERELEASE: ${{ needs.get-version.outputs.IS_PRERELEASE }}
    outputs:
      VERSION: ${{ steps.pass-outputs.outputs.VERSION }}
      VERSION_NAME: ${{ steps.pass-outputs.outputs.VERSION_NAME }}
      IS_PRERELEASE: ${{ steps.pass-outputs.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update version in config.py
        shell: pwsh
        run: |
          $path = "src\core\config.py"
          $content = Get-Content $path -Raw
          $content = $content -replace '(?m)^(\s*)appVersion\s*=\s*".*?"', "`$1appVersion = `"$env:VERSION`""
          [System.IO.File]::WriteAllText($(Resolve-Path $path), $content, $(New-Object System.Text.UTF8Encoding($false)))

      - name: Compile Qt resources
        run: pyside6-rcc resources.qrc -o resources_rc.py

      - name: Build with Nuitka
        run: python scripts/deploy.py
        timeout-minutes: 120

      - name: Rename executable for installer
        shell: pwsh
        run: |
          Rename-Item -Path "dist\main.dist\main.exe" -NewName "HOPE-Link-Client.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          # Replace version placeholder
          (Get-Content HOPE-Link-Client.iss) -replace 'APPLICATION_VERSION', "$env:VERSION" | Set-Content HOPE-Link-Client.iss

          # Download Chinese language files before compiling
          $issLangDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Write-Host "Downloading translation files to: $issLangDir"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "$issLangDir\ChineseSimplified.isl"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile "$issLangDir\ChineseTraditional.isl"

          # Try to find iscc.exe
          $isccPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\iscc.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\iscc.exe",
            "C:\Program Files\Inno Setup 6\iscc.exe"
          )
          $iscc = $null
          foreach ($p in $isccPaths) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "$env:ProgramFiles", "$env:ProgramFiles(x86)" -Recurse -Filter "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "iscc.exe not found" }

          Write-Host "Using iscc: $iscc"
          & $iscc HOPE-Link-Client.iss

      - name: Rename installer and copy to workspace root
        shell: pwsh
        run: |
          $setupFiles = Get-ChildItem -Path "dist\HOPE-Link-Client_*.exe" -ErrorAction SilentlyContinue
          if (-not $setupFiles) {
            $setupFiles = Get-ChildItem -Path "dist\*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*setup*" -or $_.Name -like "*installer*" }
          }
          if ($setupFiles) {
            $setupFile = $setupFiles | Select-Object -First 1
            $newName = "HOPE-Link-Client_${env:VERSION_NAME}_windows_x64_setup.exe"
            Write-Host "Renaming '$($setupFile.Name)' -> '$newName'"
            Rename-Item -Path $setupFile.FullName -NewName $newName

            $destPath = "$env:GITHUB_WORKSPACE\$newName"
            Copy-Item -Path "dist\$newName" -Destination $destPath -Force
            Write-Host "Copied to workspace: $destPath"
          } else {
            Write-Host "No setup exe found in dist/, checking..."
            Get-ChildItem -Path dist -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $distDir = "HOPE-Link-Client_${env:VERSION_NAME}_windows_x64"
          Move-Item dist\main.dist $distDir -ErrorAction SilentlyContinue
          if (Test-Path $distDir) {
            Compress-Archive -Path "$distDir\*" -DestinationPath "${distDir}_portable.zip"
            Write-Host "Created portable zip: ${distDir}_portable.zip"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifact
          path: |
            HOPE-Link-Client_${{ env.VERSION_NAME }}_windows_x64_portable.zip
            HOPE-Link-Client_${{ env.VERSION_NAME }}_windows_x64_setup.exe

      - name: Pass outputs
        id: pass-outputs
        shell: pwsh
        run: |
          echo "VERSION=$env:VERSION" >> $env:GITHUB_OUTPUT
          echo "VERSION_NAME=$env:VERSION_NAME" >> $env:GITHUB_OUTPUT
          echo "IS_PRERELEASE=$env:IS_PRERELEASE" >> $env:GITHUB_OUTPUT

  # ── Linux builds (amd64 + arm64) ──────────────────────────────────────────
  linux-build:
    needs: get-version
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
            python_arch: x64
          - arch: arm64
            os: ubuntu-24.04-arm
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      NUITKA_JOBS: "2"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install latest patchelf
        run: |
          sudo apt-get remove -y patchelf 2>/dev/null || true
          wget -qO- "https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-$(uname -m).tar.gz" | tar -xz
          sudo install -m755 bin/patchelf /usr/local/bin/patchelf

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update version in config.py
        run: |
          sed -i 's/^\(\s*\)appVersion\s*=\s*".*"/\1appVersion = "'"$VERSION"'"/' src/core/config.py

      - name: Compile Qt resources
        run: pyside6-rcc resources.qrc -o resources_rc.py

      - name: Remove .o object files from PySide6 (avoids patchelf ET_REL error)
        run: |
          python -c "import PySide6; p=PySide6.__path__[0]; import subprocess; subprocess.run(['find', p, '-name', '*.o', '-delete'], check=False)"

      - name: Build with Nuitka
        run: python scripts/deploy.py
        timeout-minutes: 120

      - name: Build .deb package (amd64 only)
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          DIST_DIR="dist/main.dist"
          DEB_ROOT="$RUNNER_TEMP/deb-root"
          PACKAGE_NAME="hope-link-client"
          INSTALL_DIR="/opt/HOPE-Link-Client"

          rm -rf "$DEB_ROOT"
          mkdir -p \
            "$DEB_ROOT/DEBIAN" \
            "$DEB_ROOT$INSTALL_DIR" \
            "$DEB_ROOT/usr/bin" \
            "$DEB_ROOT/usr/share/applications" \
            "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          cp -R "$DIST_DIR"/. "$DEB_ROOT$INSTALL_DIR/"
          chmod +x "$DEB_ROOT$INSTALL_DIR/main.bin"
          ln -s "$INSTALL_DIR/main.bin" "$DEB_ROOT/usr/bin/$PACKAGE_NAME"

          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: $PACKAGE_NAME
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: kkl <kkl@example.com>
          Description: HOPE-Link-Client - A PySide6 desktop app for OLED display communication over UART
          Depends: libegl1, libgl1, libxkbcommon-x11-0, libfontconfig1, libdbus-1-3
          EOF

          cat > "$DEB_ROOT/usr/share/applications/hope-link-client.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=HOPE-Link-Client
          Comment=A PySide6 desktop app for OLED display communication over UART
          Exec=$PACKAGE_NAME
          Icon=$PACKAGE_NAME
          Terminal=false
          Categories=Network;Utility;
          StartupNotify=false
          EOF

          cp "assets/icons/puzzle.png" "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/$PACKAGE_NAME.png" 2>/dev/null || true

          dpkg-deb --build --root-owner-group "$DEB_ROOT" "dist/HOPE-Link-Client_${VERSION_NAME}_linux_${{ matrix.arch }}.deb"
          echo "DEB_FILE=dist/HOPE-Link-Client_${VERSION_NAME}_linux_${{ matrix.arch }}.deb" >> $GITHUB_ENV

      - name: Upload .deb artifact
        if: ${{ matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}-deb
          path: dist/HOPE-Link-Client_${{ env.VERSION_NAME }}_linux_${{ matrix.arch }}.deb

      - name: Package portable tar.gz
        run: |
          mv dist/main.dist "HOPE-Link-Client_${VERSION_NAME}_linux_${{ matrix.arch }}"
          tar -czf "HOPE-Link-Client_${VERSION_NAME}_linux_${{ matrix.arch }}_portable.tar.gz" "HOPE-Link-Client_${VERSION_NAME}_linux_${{ matrix.arch }}"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}-artifact
          path: HOPE-Link-Client_${{ env.VERSION_NAME }}_linux_${{ matrix.arch }}_portable.tar.gz

  # ── macOS builds (x86_64 + arm64) ─────────────────────────────────────────
  macos-build:
    needs: get-version
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install system dependencies
        run: brew install create-dmg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update version in config.py
        run: |
          sed -i '' 's/^\([[:space:]]*\)appVersion = ".*"/\1appVersion = "'"$VERSION"'"/' src/core/config.py

      - name: Compile Qt resources
        run: pyside6-rcc resources.qrc -o resources_rc.py

      - name: Build with Nuitka (creates .app, codesign failure is handled in deploy.py)
        run: python scripts/deploy.py
        timeout-minutes: 120

      - name: Rename app bundle
        run: |
          if [ -d "dist/main.app" ]; then
            mv "dist/main.app" "dist/HOPE-Link-Client.app"
            echo "Renamed dist/main.app → dist/HOPE-Link-Client.app"
          else
            echo "No dist/main.app found"
            ls -la dist/
            exit 1
          fi

      - name: Clean build artifacts for signing
        run: |
          APP_BUNDLE="dist/HOPE-Link-Client.app"
          find "$APP_BUNDLE" -type d -name ".qt" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_BUNDLE" -name "*.o" -delete 2>/dev/null || true
          rm -rf "dist/main.dist" "dist/main.build" 2>/dev/null || true

      - name: Ad-hoc sign the .app bundle
        run: |
          codesign --force --deep -s - "dist/HOPE-Link-Client.app"
          echo "Signed (ad-hoc): dist/HOPE-Link-Client.app"

      - name: Package .dmg
        run: |
          APP_BUNDLE="dist/HOPE-Link-Client.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "ERROR: $APP_BUNDLE not found"
            ls -la dist/
            exit 1
          fi
          create-dmg \
            --volname "HOPE-Link-Client Installer" \
            --window-pos 400 200 \
            --window-size 660 400 \
            --icon-size 80 \
            --icon "HOPE-Link-Client.app" 160 160 \
            --hide-extension "HOPE-Link-Client.app" \
            --app-drop-link 500 160 \
            "HOPE-Link-Client_${{ env.VERSION_NAME }}_macos_${{ matrix.arch }}.dmg" \
            "$APP_BUNDLE"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-artifact
          path: HOPE-Link-Client_${{ env.VERSION_NAME }}_macos_${{ matrix.arch }}.dmg

  # ── Publish ────────────────────────────────────────────────────────────────
  # Only runs on tag push (not workflow_dispatch) to create a GitHub Release.
  publish:
    if: github.event_name != 'workflow_dispatch'
    needs: [windows-build, linux-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    env:
      VERSION_NAME: ${{ needs.windows-build.outputs.VERSION_NAME }}
      IS_PRERELEASE: ${{ needs.windows-build.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: v${{ env.VERSION_NAME }}
          make_latest: ${{ env.IS_PRERELEASE != 'true' }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/**
